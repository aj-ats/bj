# Local defaults only. Set ADMIN_PASSWORD before exposing the app.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    # Local access for `npm run dev`. Remove this on a public host.
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      LEADERBOARD_DATABASE_URL: postgres://leaderboard_user:leaderboard_pass@db:5432/freebj_leaderboard
      ADMIN_DATABASE_URL: postgres://admin_user:admin_pass@db:5432/freebj_admin
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      STATIC_DIR: /app/dist/web
      NODE_ENV: production
      PORT: "8080"
      # CSP origin for the RPS page. The browser dials this RPC. The container does not.
      RPS_RPC_URL: ${RPS_RPC_URL:-http://127.0.0.1:8545}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
